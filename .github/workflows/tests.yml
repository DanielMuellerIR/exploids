# CI: baut das SwiftPM-Paket und führt die GameCore-Testsuite aus.
# Die Tests sind headless (SoundManager erkennt Tests vor dem Engine-Start, kein GUI,
# kein Code-Signing nötig). Simulationstests verwenden feste Seeds und Schritte —
# sie laufen deshalb ohne Zusatz-Setup auf einem GitHub-macOS-Runner.
# Releases bleiben bewusst manuell (wrappers/sign-and-release.sh) — dieser Workflow
# testet nur, er veröffentlicht nichts.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift-Version anzeigen
        run: swift --version
      - name: Bauen und testen
        run: swift test
      # Shell-Integrationstests: CLI-Version, stumme Replay-Exporte und Fehlerpfade
      # der Build-Skripte. Renderprüfungen benötigen Metal und melden andernfalls
      # einen ausdrücklichen Skip; Zertifikat und Notar-Profil sind nicht nötig.
      # Die Pfadprobe braucht das gestrippte Auslieferungs-Binary im Bundle.
      - name: App-Bundle für die Binärprobe bauen
        run: bash build-app.sh
      - name: Shell-Tests
        run: bash Tests/run-shell-tests.sh
